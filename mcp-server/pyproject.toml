[project]
name = "fluxguardian-mcp-server"
version = "0.1.0"
description = "FluxGuardian MCP server — exposes OpenMetadata tools for Claude Desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fluxguardian-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
